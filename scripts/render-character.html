<!DOCTYPE html>
<html>
<head>
  <style>
    body { margin: 0; background: transparent; overflow: hidden; }
    canvas { display: block; }
  </style>
</head>
<body>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.162.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.162.0/examples/jsm/"
      }
    }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    const RENDER_SIZE = 512; // Render at high res, then downscale
    const FRAME_COUNT = 16;
    const BOB_AMPLITUDE = 0.03; // Vertical bob (relative to model height)
    const TILT_AMPLITUDE = 3; // Degrees of body tilt

    // Isometric camera angles for each direction
    // In the game's isometric view:
    // South = facing toward viewer (down-right)
    // North = facing away (up-left)
    // East = facing right
    // West = facing left
    const DIRECTIONS = {
      south: Math.PI * 0.75,    // 135 deg - facing toward camera
      north: Math.PI * -0.25,   // -45 deg - facing away
      east: Math.PI * 0.25,     // 45 deg - facing right
      west: Math.PI * 1.25,     // 225 deg - facing left
    };

    let scene, camera, renderer, model;
    let modelCenter, modelHeight;

    async function init() {
      scene = new THREE.Scene();
      // Transparent background
      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setSize(RENDER_SIZE, RENDER_SIZE);
      renderer.setClearColor(0x000000, 0);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      document.body.appendChild(renderer.domElement);

      // Isometric-like orthographic camera
      const frustumSize = 2;
      const aspect = 1;
      camera = new THREE.OrthographicCamera(
        -frustumSize * aspect / 2, frustumSize * aspect / 2,
        frustumSize / 2, -frustumSize / 2,
        0.1, 100
      );

      // Lighting — bright to keep character visible at small pixel sizes
      const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
      scene.add(ambientLight);

      const directionalLight = new THREE.DirectionalLight(0xffffff, 1.5);
      directionalLight.position.set(5, 10, 5);
      scene.add(directionalLight);

      // Fill light from the front
      const fillLight = new THREE.DirectionalLight(0xffffff, 0.8);
      fillLight.position.set(-3, 3, 5);
      scene.add(fillLight);

      // Bottom fill to reduce dark shadows
      const bottomFill = new THREE.DirectionalLight(0xffffff, 0.4);
      bottomFill.position.set(0, -5, 0);
      scene.add(bottomFill);

      // Load model
      const loader = new GLTFLoader();
      const glbPath = window.__GLB_PATH__ || '/model/textured.glb';
      const gltf = await loader.loadAsync(glbPath);
      model = gltf.scene;

      // Center and scale model
      const box = new THREE.Box3().setFromObject(model);
      const center = box.getCenter(new THREE.Vector3());
      const size = box.getSize(new THREE.Vector3());
      modelHeight = size.y;
      modelCenter = center.clone();

      // Move model so its center is at origin
      model.position.sub(center);
      // Move up so feet are at y=0
      model.position.y += size.y / 2;

      scene.add(model);

      // Position camera for isometric view
      // ~30 degree elevation for isometric feel
      const distance = 5;
      const elevation = Math.PI / 6; // 30 degrees

      camera.position.set(
        distance * Math.cos(elevation) * Math.sin(0),
        distance * Math.sin(elevation) + size.y / 2,
        distance * Math.cos(elevation) * Math.cos(0)
      );
      camera.lookAt(0, size.y * 0.4, 0);

      // Adjust frustum to fit the model tightly
      const padding = 1.3;
      const maxDim = Math.max(size.x, size.y, size.z) * padding;
      camera.left = -maxDim / 2;
      camera.right = maxDim / 2;
      camera.top = maxDim / 2;
      camera.bottom = -maxDim / 2;
      camera.updateProjectionMatrix();

      window.__RENDERER_READY__ = true;
    }

    window.__renderFrames = async function(direction) {
      const angle = DIRECTIONS[direction];
      if (angle === undefined) return [];

      const distance = 5;
      const elevation = Math.PI / 6;
      const frames = [];

      for (let i = 0; i < FRAME_COUNT; i++) {
        const t = (i / FRAME_COUNT) * Math.PI * 2;

        // Camera rotation around model for direction
        camera.position.set(
          distance * Math.cos(elevation) * Math.sin(angle),
          distance * Math.sin(elevation) + modelHeight * 0.4,
          distance * Math.cos(elevation) * Math.cos(angle)
        );
        camera.lookAt(0, modelHeight * 0.4, 0);

        // Walking animation transforms
        // Vertical bob
        model.position.y = modelHeight / 2 + Math.sin(t * 2) * modelHeight * BOB_AMPLITUDE;

        // Body tilt (lean left/right)
        model.rotation.z = Math.sin(t) * (TILT_AMPLITUDE * Math.PI / 180);

        // Slight forward/backward lean
        const forwardAxis = new THREE.Vector3(
          Math.cos(angle + Math.PI / 2),
          0,
          Math.sin(angle + Math.PI / 2)
        ).normalize();
        model.rotation.x = Math.sin(t + Math.PI / 4) * (1.5 * Math.PI / 180);

        camera.updateProjectionMatrix();
        renderer.render(scene, camera);

        // Get frame as data URL
        frames.push(renderer.domElement.toDataURL('image/png'));

        // Reset rotation for next frame
        model.rotation.set(0, 0, 0);
      }

      return frames;
    };

    init().catch(err => {
      console.error('Init error:', err);
      window.__RENDERER_ERROR__ = err.message;
    });
  </script>
</body>
</html>
