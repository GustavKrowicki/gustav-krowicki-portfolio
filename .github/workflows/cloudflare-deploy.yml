name: Cloudflare deploy

# Every push to main builds the live site and deploys it to www.gustavkrowicki.com (docs/hosting-cloudflare.md).
# Branch previews are in cloudflare-preview.yml.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Deploys run one at a time, in push order; a newer push waits for the running deploy instead of cancelling it.
concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CF_SEND_TELEMETRY: "false"
      # Public values: both are in the shipped JavaScript.
      NEXT_PUBLIC_POSTHOG_KEY: phc_jzjw0yLX8cEDIHtRNtlLtHVoCfdBewqsxdV9S8NdBYE
      NEXT_PUBLIC_POSTHOG_HOST: https://pht.gustavkrowicki.com
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The live build: PostHog on, images through /cdn-cgi/image/.
      - run: npm run cf:build:live
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx cf deploy --prebuilt --message "${GITHUB_SHA::7} $(git log -1 --format=%s | cut -c1-80)"
      - name: Summary
        run: echo "Deployed ${GITHUB_SHA::7} to https://www.gustavkrowicki.com" >> "$GITHUB_STEP_SUMMARY"
